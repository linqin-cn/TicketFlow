# ===== 应用配置 =====
#应用名称
spring.application.name=batch
#环境配置
spring.profiles.active=dev

# ===== Nacos 配置中心 相关配置=====
spring.cloud.nacos.config.server-addr=nacos.linqin.space
spring.cloud.nacos.config.namespace=train
spring.cloud.nacos.config.group=DEFAULT_GROUP
spring.cloud.nacos.config.file-extension=properties
spring.cloud.nacos.config.username=nacos
spring.cloud.nacos.config.password=nacos

# ===== Nacos 服务发现相关配置 =====
spring.cloud.nacos.discovery.server-addr=nacos.linqin.space
spring.cloud.nacos.discovery.namespace=train
spring.cloud.nacos.discovery.username=nacos
spring.cloud.nacos.discovery.password=nacos
